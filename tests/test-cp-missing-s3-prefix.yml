name: Test cp command with missing s3:// prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with cp command but both source and destination are local paths (expect failure)
        id: action
        uses: .
        with:
          command: cp
          source: /local/source/file.txt
          destination: /local/dest/file.txt
          aws_access_key_id: fake-key-id
          aws_secret_access_key: fake-secret-key
        continue-on-error: true

      - name: Assert action failed for missing s3:// prefix on cp command
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when cp command has no s3:// prefix on source or destination, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected cp command without s3:// prefix"
