name: Test sync command validation passes with s3:// prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run sync command with s3:// source (validation should pass, AWS call will fail)
        id: action
        uses: .
        with:
          command: sync
          source: s3://mybucket/myfolder/
          destination: ./local_folder/
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          aws_region: us-east-1
        continue-on-error: true
      - name: Assert action ran past validation (failed at AWS level)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the AWS API call (invalid credentials),
          # not at the validation stage. We confirm the action ran.
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not produce an outcome"
            exit 1
          fi
          echo "PASS: action ran and produced outcome=$OUTCOME (sync validation passed, AWS credentials rejected as expected)"
      - name: Run sync command without s3:// prefix (expect validation failure)
        id: action_no_prefix
        uses: .
        with:
          command: sync
          source: ./local_folder/
          destination: ./another_folder/
        continue-on-error: true
      - name: Assert sync without s3:// prefix fails validation
        env:
          OUTCOME: ${{ steps.action_no_prefix.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when sync has no s3:// prefix, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: sync correctly failed validation when no s3:// prefix provided"
