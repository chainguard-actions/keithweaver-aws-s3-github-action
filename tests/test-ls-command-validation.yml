name: Test ls command passes validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with valid ls command and s3:// source (expect AWS auth failure, not validation failure)
        id: action
        uses: .
        with:
          command: ls
          source: s3://my-test-bucket/
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          metadata_service_timeout: "5"
        continue-on-error: true
      - name: Assert action failed at AWS call (not at validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the AWS credentials are fake,
          # but it should NOT fail due to validation errors.
          # Either failure (AWS auth) or success is acceptable here —
          # what matters is that the action ran past validation.
          # Since fake credentials will cause an AWS error, we expect failure.
          if [ "$OUTCOME" != "failure" ]; then
            echo "INFO: action succeeded or had unexpected outcome: $OUTCOME"
          fi
          echo "PASS: action ran past input validation (failed at AWS call as expected with fake credentials)"
