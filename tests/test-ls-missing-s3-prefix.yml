name: Test ls command requires s3:// prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run ls command with local path (expect failure)
        id: action
        uses: .
        with:
          command: ls
          source: ./local_path
        continue-on-error: true
      - name: Assert action failed due to missing s3:// prefix on ls source
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when ls source lacks s3:// prefix, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when ls source lacked s3:// prefix"
