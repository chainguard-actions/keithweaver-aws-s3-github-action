name: Test all inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source file
        run: echo "test content" > /tmp/test-source.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: cp
          source: /tmp/test-source.txt
          destination: /tmp/test-destination.txt
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          aws_session_token: AQoDYXdzEJr__FAKE_SESSION_TOKEN__
          aws_region: us-east-1
          metadata_service_timeout: "10"
          flags: --no-progress

      - name: Verify action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "All inputs were passed to the action successfully"
          echo "PASS"
