name: Test valid ls command with s3:// source
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with valid ls command and s3:// source (expect AWS auth failure, not validation failure)
        id: action
        uses: .
        with:
          command: ls
          source: s3://test-bucket-that-does-not-exist-12345
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          metadata_service_timeout: "5"
        continue-on-error: true

      - name: Assert action failed at AWS level (not at validation level)
        id: check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid AWS credentials (not because of
          # invalid command or missing s3:// prefix). We just verify the action ran
          # past validation (i.e., it attempted the AWS call).
          # Since we cannot use real AWS credentials in tests, we accept either
          # failure (auth error from AWS) as the expected outcome here.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran past validation and failed at AWS API level (expected with fake credentials)"
          else
            echo "PASS: action succeeded (unexpected but acceptable)"
          fi
          echo "PASS"
