name: Test cp command with local source and s3 destination
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a local test file
        run: echo "hello world" > /tmp/test-file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: cp
          source: /tmp/test-file.txt
          destination: s3://my-test-bucket/test-file.txt
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      - name: Assert action ran (failed at AWS level, not validation level)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the fake credentials are rejected by AWS,
          # but it should NOT fail at the command/source/destination validation stage.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed at AWS level (expected with fake credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
