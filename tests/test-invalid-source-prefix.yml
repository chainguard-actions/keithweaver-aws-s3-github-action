name: Test invalid source prefix rejection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with ls command but non-s3:// source (expect failure)
        id: action
        uses: .
        with:
          command: ls
          source: /local/path/not-s3
          aws_access_key_id: fake-key-id
          aws_secret_access_key: fake-secret-key
        continue-on-error: true

      - name: Assert action failed for missing s3:// prefix
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when source lacks s3:// prefix, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected source without s3:// prefix"
