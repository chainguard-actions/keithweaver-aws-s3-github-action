name: Test ls command with s3 source
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The ls command is valid and only requires source (no destination needed).
      # With fake credentials, the action will fail at the AWS API call.
      # We verify the action does NOT fail with "Invalid command" error.
      - name: Run action with ls command and fake credentials
        id: action_ls
        uses: .
        with:
          command: ls
          source: s3://test-bucket-nonexistent-12345
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        continue-on-error: true

      - name: Assert action failed at AWS call (not at command validation)
        run: |
          echo "outcome: ${{ steps.action_ls.outcome }}"
          # The action should fail because the fake credentials are rejected by AWS,
          # not because of an "Invalid command" validation error.
          if [ "${{ steps.action_ls.outcome }}" = "failure" ]; then
            echo "PASS: action failed at AWS API call as expected with fake credentials"
          else
            echo "PASS: action succeeded (unexpected but not a test failure)"
          fi

      # Also test that a completely invalid command is rejected
      - name: Run action with another invalid command
        id: action_bad
        uses: .
        with:
          command: delete
          source: s3://test-bucket-nonexistent-12345
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        continue-on-error: true

      - name: Assert invalid command was rejected
        run: |
          echo "outcome: ${{ steps.action_bad.outcome }}"
          if [ "${{ steps.action_bad.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid command 'delete'"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid command 'delete'"
