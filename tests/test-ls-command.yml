name: Test ls command with s3 source
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: ls
          source: s3://my-test-bucket/
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      - name: Assert action ran (failed at AWS level, not validation level)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the fake credentials are rejected by AWS,
          # but it should NOT fail at the command/source validation stage.
          # Either failure or success is acceptable here — what matters is the
          # action did not exit early due to invalid command or missing source.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed at AWS level (expected with fake credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
