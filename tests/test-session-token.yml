name: Test aws_session_token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: ls
          source: s3://example-bucket/
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          aws_session_token: AQoDYXdzEJr__EXAMPLE_SESSION_TOKEN__
          metadata_service_timeout: "5"
      - name: Assert action ran with session token (fails gracefully on invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with session token"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (invalid/fake credentials expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
