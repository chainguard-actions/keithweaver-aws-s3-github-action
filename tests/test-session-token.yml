name: Test ls command with aws_session_token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with aws_session_token input
        id: action
        uses: .
        with:
          command: ls
          source: s3://test-bucket-session-token-12345/
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          aws_session_token: AQoDYXdzEJr//////////wEaoAK1wvxJY12r2IWAsdFake0SessionToken
          metadata_service_timeout: "5"
        continue-on-error: true

      - name: Assert action ran past validation (session token accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the AWS API level (invalid credentials/session token),
          # NOT at the input validation level. We verify the action accepted the
          # aws_session_token input and attempted the AWS call.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran past validation and failed at AWS API level (expected with fake session token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
