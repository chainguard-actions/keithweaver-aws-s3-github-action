name: Test invalid command fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid command (expect failure)
        id: action
        uses: .
        with:
          command: invalid_command
          source: s3://mybucket/myfile.txt
          destination: ./myfile.txt
        continue-on-error: true
      - name: Assert action failed on invalid command
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid command, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid command"
