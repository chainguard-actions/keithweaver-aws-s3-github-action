name: Test invalid command rejection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid command
        id: action
        uses: .
        with:
          command: invalid-command
          source: s3://some-bucket/some-file.txt
          destination: s3://other-bucket/some-file.txt
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        continue-on-error: true

      - name: Assert action failed for invalid command
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid command, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid command"
