name: Test default cp command when no command specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without specifying command (defaults to cp, expect AWS failure not validation failure)
        id: action
        uses: .
        with:
          source: s3://nonexistent-bucket-for-testing-12345/file.txt
          destination: ./downloaded-file.txt
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          aws_region: us-east-1
        continue-on-error: true

      - name: Assert action failed at AWS level (validation passed with default cp command)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because AWS credentials are fake / bucket doesn't exist,
          # NOT because of input validation. This confirms the default cp command passes validation.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (AWS error), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed at AWS level as expected (default cp command passed validation)"
